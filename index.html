<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela Brasileirão Série A | Classificação Interativa</title>
  <meta name="description" content="Tabela interativa e atualizada do Brasileirão Série A com dados em tempo real extraídos diretamente da estrutura do ge.globo. Pontos (P), Jogos (J) e Vitórias (V).">
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=2.7">
  <link rel="stylesheet" href="jogos.css?v=2.7">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300b04f'><circle cx='12' cy='12' r='10'/><path d='M12 4a8 8 0 0 1 8 8c0 2.2-.9 4.2-2.3 5.7L12 12V4z' fill='%23ffffff'/></svg>">
</head>
<body>
  <div class="app-background">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="app-container">
    <!-- Cabeçalho Principal -->
    <header class="app-header">
      <div class="header-main">
        <div class="header-title-container">
          <div class="header-brand-wrap" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <h1 class="main-title">
              <span class="title-gradient">Brasileirão</span>
              <button type="button" class="title-highlight series-selector-btn" id="btnOpenSeriesModal" title="Clique para escolher a Série (A ou B)">
                <span id="currentSeriesLabel">Série A</span>
                <svg class="series-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle;">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
            </h1>
            <button type="button" class="header-nav-btn" id="btnToggleView" title="Alternar entre Classificação e Jogos" style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;color:#008744;border:1.5px solid #00a854;padding:7px 16px;border-radius:9999px;font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;letter-spacing:0.04em;box-shadow:0 2px 8px rgba(0,168,84,0.15);white-space:nowrap;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0;">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
              </svg>
              <span id="navViewText">JOGOS</span>
            </button>

            <!-- Navegador Compacto de Rodadas (visível na tela de Jogos conforme print) -->
            <div class="header-round-nav" id="headerRoundNav" style="display: none;">
              <div class="header-round-nav-top">
                <span class="header-round-title" id="roundTitleText">--ª RODADA</span>
                <span class="header-round-badge" id="roundBadgeCurrent" style="display: none;">RODADA ATUAL</span>
              </div>
              <div class="header-round-nav-bottom">
                <button type="button" class="header-round-btn" id="btnPrevRound" title="Ver rodada anterior (Seta Esquerda)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                  <span>Anterior</span>
                </button>
                <button type="button" class="header-round-btn" id="btnNextRound" title="Ver próxima rodada (Seta Direita)">
                  <span>Próxima</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <img src="NC%20SPORTS%20LOGO.png" alt="NC Sports Logo" class="header-nc-logo" onerror="this.src='nc-sports-logo.png'">
        </div>
      </div>
    </header>

    <!-- Tabela Interativa (Visão Classificação) -->
    <main class="table-card" id="viewTabela">
      <div class="table-responsive-wrapper">
        <table class="tabela-brasileirao" id="tabelaBrasileirao">
          <thead>
            <tr>
              <th class="th-pos sortable" data-sort="ordem" title="Clique para ordenar por Posição">
                <div class="th-content">
                  <span>POS</span>
                  <span class="sort-indicator" id="sort-icon-ordem"></span>
                </div>
              </th>
              <th class="th-time sortable" data-sort="time" title="Clique para ordenar por Nome">
                <div class="th-content">
                  <span>CLASSIFICAÇÃO</span>
                  <span class="sort-indicator" id="sort-icon-time"></span>
                </div>
              </th>
              <th class="th-stat sortable active" data-sort="pontos" title="Clique para ordenar por Pontos">
                <div class="th-content">
                  <span>PONTOS</span>
                  <span class="sort-indicator" id="sort-icon-pontos">▼</span>
                </div>
              </th>
              <th class="th-stat sortable" data-sort="jogos" title="Clique para ordenar por Jogos">
                <div class="th-content">
                  <span>JOGOS</span>
                  <span class="sort-indicator" id="sort-icon-jogos"></span>
                </div>
              </th>
              <th class="th-stat sortable" data-sort="vitorias" title="Clique para ordenar por Vitórias">
                <div class="th-content">
                  <span>VITÓRIAS</span>
                  <span class="sort-indicator" id="sort-icon-vitorias"></span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo">
            <!-- As linhas da tabela são renderizadas dinamicamente pelo app.js -->
            <tr class="loading-row">
              <td colspan="5">
                <div class="loading-container">
                  <div class="spinner"></div>
                  <p>Carregando tabela oficial do Brasileirão...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Jogos da Rodada (Visão Alternável de 10 jogos em 2 colunas) -->
    <div id="viewJogos" style="display: none; flex-direction: column; flex: 1 1 auto; min-height: 0;">
      <!-- Área Rolável com as Duas Colunas de Jogos (5 em cada) -->
      <div class="games-scroll-area" id="gamesContainer">
        <div class="games-two-columns">
          <!-- Coluna Esquerda: 5 Jogos -->
          <div class="games-column" id="gamesColLeft"></div>

          <!-- Coluna Direita: 5 Jogos -->
          <div class="games-column" id="gamesColRight"></div>
        </div>
      </div>
    </div>

    <!-- Modal de Comparação de Times -->
    <div class="modal-overlay" id="compareModal" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Comparador Direto (P, J, V)</h3>
          <button class="btn-close-modal" id="btnCloseCompare">&times;</button>
        </div>
        <div class="modal-body" id="compareModalBody">
          <!-- Conteúdo da comparação gerado dinamicamente -->
        </div>
      </div>
    </div>

    <!-- Modal de Seleção de Série -->
    <div class="modal-overlay" id="seriesModal" style="display: none;">
      <div class="modal-box modal-box-sm">
        <div class="modal-header">
          <h3>Selecione a Divisão</h3>
          <button class="btn-close-modal" id="btnCloseSeriesModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="series-options-list">
            <button type="button" class="series-card-option active" data-serie="a">
              <div class="series-card-content">
                <div class="series-card-badge badge-a">A</div>
                <div class="series-card-text">
                  <strong>Brasileirão Série A</strong>
                  <span>Primeira Divisão</span>
                </div>
              </div>
              <span class="series-check-icon">✓</span>
            </button>

            <button type="button" class="series-card-option" data-serie="b">
              <div class="series-card-content">
                <div class="series-card-badge badge-b">B</div>
                <div class="series-card-text">
                  <strong>Brasileirão Série B</strong>
                  <span>Segunda Divisão</span>
                </div>
              </div>
              <span class="series-check-icon">✓</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="sync.js"></script>
  <script src="jogos.js"></script>
  <script src="app.js"></script>
</body>
</html>
