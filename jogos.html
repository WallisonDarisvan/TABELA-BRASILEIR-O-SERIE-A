<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando para Jogos...</title>
  <script>
    // Redireciona instantaneamente para a visão de jogos no index.html sem quebrar histórico
    const search = window.location.search ? window.location.search + '&view=jogos' : '?view=jogos';
    window.location.replace('index.html' + search);
  </script>
</head>
<body style="background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
  <p>Carregando jogos...</p>
</body>
</html>
